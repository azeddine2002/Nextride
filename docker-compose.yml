services:
  app:
    build: .
    container_name: nextride_app
    ports:
      - "8080:80"
    volumes:
      - .:/var/www/html
      # vendor/ et var/ restent dans des volumes Docker natifs (pas sur le disque Windows) :
      # sur Windows, lire des milliers de fichiers via le montage Windows->WSL2->conteneur
      # est tres lent (page qui met 20s+ a charger). Ici, Docker les isole du bind mount.
      - app_vendor:/var/www/html/vendor
      - app_var:/var/www/html/var
    depends_on:
      - database

  database:
    image: mysql:8.0
    container_name: nextride_db
    restart: always
    environment:
      MYSQL_DATABASE: nextride_db
      MYSQL_USER: nextride_user
      MYSQL_PASSWORD: nextride_pass
      MYSQL_ROOT_PASSWORD: root_pass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

  adminer:
    image: adminer
    container_name: nextride_adminer
    ports:
      - "8081:8080"

volumes:
  db_data:
  app_vendor:
  app_var: