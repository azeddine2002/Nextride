name: CI

on:
  push:
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nextride_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: "mysql://root:root@127.0.0.1:3306/nextride_test?serverVersion=8.0.32&charset=utf8mb4"

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Installer PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, pdo_mysql, zip, opcache
          coverage: none

      - name: Installer les dependances Composer
        run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Executer les migrations sur la base de test
        run: php bin/console doctrine:migrations:migrate --env=test --no-interaction

      - name: Executer les tests PHPUnit
        run: php bin/phpunit

  build-docker:
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - name: Recuperer le code
        uses: actions/checkout@v4

      - name: Construire l'image Docker
        run: docker build -t nextride-app .
